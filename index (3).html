<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Otomasyonu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; user-select: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
  @keyframes callPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  #callerBanner { animation: callPulse 1.4s ease-in-out infinite; }
</style>
</head>
<body class="bg-neutral-900 h-screen overflow-hidden font-sans text-sm">

<div id="app" class="h-screen flex flex-col bg-neutral-900 text-neutral-100"></div>
<div id="callerBannerWrap"></div>
<div id="modalOverlay" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[60] p-4"></div>

<script>
// ================= VARSAYILAN VERİ =================
const DEFAULT_CATEGORIES = [
  { name: "Döner", products: [
    { name: "Et Döner (Dürüm)", price: 140 },
    { name: "Et Döner (Porsiyon)", price: 180 },
    { name: "Tavuk Döner (Dürüm)", price: 110 },
    { name: "Tavuk Döner (Porsiyon)", price: 150 },
    { name: "Çift Et Dürüm", price: 190 }
  ]},
  { name: "İskender", products: [
    { name: "İskender (Tek Porsiyon)", price: 220 },
    { name: "İskender (Büyük Porsiyon)", price: 280 },
    { name: "Yarım İskender", price: 160 }
  ]},
  { name: "Yan Ürünler", products: [
    { name: "Patates Kızartması", price: 60 },
    { name: "Salata", price: 45 },
    { name: "Sos (Ekstra)", price: 10 },
    { name: "Lavaş Ekmek", price: 15 }
  ]},
  { name: "İçecekler", products: [
    { name: "Ayran", price: 25 },
    { name: "Kola (Kutu)", price: 40 },
    { name: "Fanta (Kutu)", price: 40 },
    { name: "Su", price: 15 },
    { name: "Şalgam", price: 30 },
    { name: "Çay", price: 20 }
  ]},
  { name: "Tatlılar", products: [
    { name: "Künefe", price: 90 },
    { name: "Sütlaç", price: 60 },
    { name: "Baklava (Adet)", price: 50 }
  ]}
];
const TABLE_COUNT = 12;
const STORAGE_KEY = "pos_state_v3";

// ================= YARDIMCI =================
function newId() { return Date.now() + Math.floor(Math.random() * 100000); }
function escapeHtml(s) { return (s == null ? "" : String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(n) { return (n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺"; }
function orderTotal(items) { return (items || []).reduce((s, it) => s + it.price * it.qty, 0); }
function elapsed(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}s ${m}dk` : `${m}dk`;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

// ================= STATE =================
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
let state = loadState() || {};
if (!state.tables) state.tables = {};
for (let i = 1; i <= TABLE_COUNT; i++) if (!state.tables[i]) state.tables[i] = { items: [] };
if (!state.pickupOrders) state.pickupOrders = [];
if (!state.deliveryOrders) state.deliveryOrders = [];
if (!state.customers) state.customers = [];
if (!state.closedTickets) state.closedTickets = [];
if (!state.ledger) state.ledger = [];
if (!state.nextTicketNo) state.nextTicketNo = 1000;
if (!state.warehouseItems) state.warehouseItems = [];
if (state.dayOpen === undefined) state.dayOpen = false;
if (!state.dayOpenedAt) state.dayOpenedAt = null;
if (!state.categories || !state.categories.length) {
  state.categories = DEFAULT_CATEGORIES.map(c => ({
    id: newId(),
    name: c.name,
    products: c.products.map(p => ({ id: newId(), name: p.name, price: p.price }))
  }));
}
let firestoreDocRef = null;
let unsubscribeSnapshot = null;
let currentTenantId = null;
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if (firestoreDocRef) {
    firestoreDocRef.set({ json: JSON.stringify(state), updatedAt: Date.now() })
      .catch(err => console.error("Firestore yazma hatası:", err));
  }
}
saveState();

// ================= NAVİGASYON DURUMU =================
let mainSection = "dashboard";  // dashboard | pos | ayarlar | adisyonlar | raporlar | cari
let posTab = "masalar";         // masalar | gelal | paket
let orderView = null;           // {type:'table'|'pickup'|'delivery', id}
let activeCategoryId = state.categories[0]?.id || null;
let keypadValue = "";

let settingsTab = "urun";       // urun | adisyon | yazici | musteri | callerid
let selectedSettingsCategoryId = state.categories[0]?.id || null;

let selectedPosCustomerId = null;
let customerSearchPaket = "";

let selectedCariCustomerId = null;
let customerSearchCari = "";

let adisyonlarDate = todayStr();

// ================= MODAL ALTYAPISI =================
function openModal(html) {
  const o = document.getElementById("modalOverlay");
  o.innerHTML = html;
  o.classList.remove("hidden");
  o.classList.add("flex");
  o.onclick = (e) => { if (e.target === o) closeModal(); };
}
function closeModal() {
  const o = document.getElementById("modalOverlay");
  o.classList.add("hidden");
  o.classList.remove("flex");
  o.innerHTML = "";
}

// ================= ORTAK SEPET İŞLEMLERİ =================
function getActiveItems() {
  if (!orderView) return null;
  if (orderView.type === "table") return state.tables[orderView.id].items;
  if (orderView.type === "pickup") return state.pickupOrders.find(o => o.id === orderView.id)?.items;
  if (orderView.type === "delivery") return state.deliveryOrders.find(o => o.id === orderView.id)?.items;
  return null;
}
function addToTicket(product) {
  const items = getActiveItems();
  if (!items) return;
  const qtyToAdd = keypadValue && parseInt(keypadValue) > 0 ? parseInt(keypadValue) : 1;
  const existing = items.find(it => it.name === product.name);
  if (existing) existing.qty += qtyToAdd;
  else items.push({ name: product.name, price: product.price, qty: qtyToAdd });
  keypadValue = "";
  saveState(); render();
}
function changeQty(name, delta) {
  const items = getActiveItems();
  if (!items) return;
  const it = items.find(x => x.name === name);
  if (!it) return;
  it.qty += delta;
  const filtered = it.qty <= 0 ? items.filter(x => x.name !== name) : items;
  if (orderView.type === "table") state.tables[orderView.id].items = filtered;
  if (orderView.type === "pickup") state.pickupOrders.find(o => o.id === orderView.id).items = filtered;
  if (orderView.type === "delivery") state.deliveryOrders.find(o => o.id === orderView.id).items = filtered;
  saveState(); render();
}
function orderMeta() {
  if (orderView.type === "table") {
    return { title: `Masa ${orderView.id}`, subtitle: "Durum: Yeni", items: state.tables[orderView.id].items };
  }
  if (orderView.type === "pickup") {
    const o = state.pickupOrders.find(x => x.id === orderView.id);
    return { title: `Gel Al - ${o.name}`, subtitle: `Durum: Yeni · ${elapsed(o.createdAt)} önce`, items: o.items };
  }
  const o = state.deliveryOrders.find(x => x.id === orderView.id);
  return { title: `Paket - ${o.customerName}`, subtitle: `${o.address || "Adres yok"}`, items: o.items };
}
function finalizeOrder(method, received) {
  const items = getActiveItems();
  const total = orderTotal(items);
  const meta = orderMeta();
  const type = orderView.type === "table" ? "Masa" : (orderView.type === "pickup" ? "Gel Al" : "Paket");
  const ticketNo = state.nextTicketNo++;
  state.closedTickets.push({ id: newId(), ticketNo, closedAt: Date.now(), total, type, method, label: meta.title });

  if (orderView.type === "table") state.tables[orderView.id].items = [];
  else if (orderView.type === "pickup") state.pickupOrders = state.pickupOrders.filter(o => o.id !== orderView.id);
  else if (orderView.type === "delivery") state.deliveryOrders = state.deliveryOrders.filter(o => o.id !== orderView.id);

  saveState();
  closeModal();
  const wasType = orderView.type;
  orderView = null;
  keypadValue = "";
  mainSection = "pos";
  posTab = wasType === "table" ? "masalar" : (wasType === "pickup" ? "gelal" : "paket");
  render();
  const changeMsg = method === "Nakit" && received > total ? ` — Para üstü: ${fmt(received - total)}` : "";
  alert(`Ödeme alındı (${method}): ${fmt(total)}${changeMsg}`);
}
function quickPay(method) {
  const items = getActiveItems();
  if (!items || !items.length) { alert("Adisyonda ürün yok."); return; }
  const total = orderTotal(items);
  if (!confirm(`${fmt(total)} tutar "${method}" ile tahsil edilsin mi?`)) return;
  finalizeOrder(method, total);
}

// ================= ÖDEME EKRANI (Nakit / Kredi / Veresiye) =================
function openPaymentModal(initialMethod) {
  const items = getActiveItems();
  if (!items || !items.length) { alert("Adisyonda ürün yok."); return; }
  const total = orderTotal(items);
  let method = initialMethod || "Nakit";
  let veresiyeCustomerId = (orderView.type === "delivery") ? state.deliveryOrders.find(o => o.id === orderView.id).customerId : null;
  let veresiyeSearch = "";

  function methodBtnClass(m) {
    const active = method === m;
    const colors = { "Nakit": "bg-emerald-600", "Kredi Kartı": "bg-blue-600", "Veresiye": "bg-rose-600" };
    return `py-3 rounded-lg font-bold text-xs sm:text-sm ${active ? colors[m] + " text-white" : "bg-neutral-700 text-neutral-300"}`;
  }
  function veresiyeAreaHtml() {
    if (method !== "Veresiye") return "";
    const selectedCustomer = state.customers.find(c => c.id === veresiyeCustomerId);
    const q = veresiyeSearch.trim().toLowerCase();
    const list = state.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").includes(q)).slice(0, 6);
    return `
      <div class="border border-rose-800 bg-rose-950/40 rounded-lg p-3 mb-2">
        <div class="text-xs font-bold text-rose-400 mb-2">Veresiye — Müşteri Seçin</div>
        ${selectedCustomer ? `
          <div class="bg-neutral-800 rounded-lg p-2 mb-2 flex justify-between items-center">
            <span class="font-bold text-sm text-white">${escapeHtml(selectedCustomer.name)}</span>
            <span class="text-xs text-neutral-400">Mevcut bakiye: ${fmt(selectedCustomer.balance || 0)}</span>
          </div>
          <button id="mVeresiyeChange" class="text-xs text-rose-400 underline mb-1">Müşteriyi değiştir</button>
        ` : `
          <input id="mVeresiyeSearch" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-2 mb-2 text-sm" placeholder="Müşteri ara..." value="${escapeHtml(veresiyeSearch)}">
          <div class="max-h-28 overflow-y-auto flex flex-col gap-1 mb-2">
            ${list.map(c => `<button class="vCustBtn text-left bg-neutral-800 active:bg-neutral-700 text-white rounded-lg p-2 text-sm" data-id="${c.id}">${escapeHtml(c.name)} ${c.phone ? "· " + escapeHtml(c.phone) : ""}</button>`).join("") || '<div class="text-xs text-neutral-500 italic p-2">Müşteri bulunamadı</div>'}
          </div>
          <button id="mVeresiyeNewCust" class="w-full bg-rose-600 active:bg-rose-700 text-white font-bold py-2 rounded-lg text-sm">+ Yeni Müşteri</button>
        `}
      </div>
    `;
  }

  function build() {
    openModal(`
      <div class="bg-neutral-800 border border-neutral-700 rounded-2xl w-full max-w-md p-5 shadow-2xl max-h-[90vh] overflow-y-auto text-white">
        <div class="font-bold text-xl mb-1">Ödeme Al</div>
        <div class="text-neutral-400 text-xs mb-4">${items.length} kalem ürün</div>
        <div class="max-h-32 overflow-y-auto mb-3 divide-y divide-neutral-700 border border-neutral-700 rounded-lg">
          ${items.map(it => `<div class="flex justify-between px-3 py-1.5 text-xs"><span>${escapeHtml(it.name)} x${it.qty}</span><span class="font-bold">${fmt(it.price * it.qty)}</span></div>`).join("")}
        </div>
        <div class="flex justify-between text-2xl font-bold mb-4 bg-neutral-900 rounded-xl p-3">
          <span>TOPLAM</span><span>${fmt(total)}</span>
        </div>
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button id="mMethodCash" class="${methodBtnClass("Nakit")}">💵 Nakit</button>
          <button id="mMethodCard" class="${methodBtnClass("Kredi Kartı")}">💳 Kredi</button>
          <button id="mMethodVeresiye" class="${methodBtnClass("Veresiye")}">📒 Veresiye</button>
        </div>
        <div id="cashArea">
          ${method === "Nakit" ? `
            <label class="block text-xs font-bold text-neutral-400 mb-1">Alınan Tutar</label>
            <input id="mReceived" type="number" step="0.01" inputmode="decimal" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 text-lg font-bold mb-2" value="${total}">
            <div class="flex gap-2 mb-2 flex-wrap">
              ${Array.from(new Set([total, Math.ceil(total / 50) * 50, Math.ceil(total / 100) * 100, total + 100])).map(v => `<button class="quickAmt bg-neutral-700 active:bg-neutral-600 text-white font-bold px-3 py-2 rounded-lg text-sm" data-v="${v}">${fmt(v)}</button>`).join("")}
            </div>
            <div class="flex justify-between text-lg font-bold text-emerald-400" id="changeRow">
              <span>Para Üstü</span><span id="changeVal">${fmt(0)}</span>
            </div>
          ` : ""}
          ${veresiyeAreaHtml()}
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button id="mPayCancel" class="bg-neutral-700 active:bg-neutral-600 text-white font-bold py-3 rounded-xl">İptal</button>
          <button id="mPayConfirm" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 rounded-xl">Ödemeyi Onayla</button>
        </div>
      </div>
    `);
    document.getElementById("mMethodCash").onclick = () => { method = "Nakit"; build(); };
    document.getElementById("mMethodCard").onclick = () => { method = "Kredi Kartı"; build(); };
    document.getElementById("mMethodVeresiye").onclick = () => { method = "Veresiye"; build(); };
    document.getElementById("mPayCancel").onclick = closeModal;

    function updateChange() {
      const input = document.getElementById("mReceived");
      if (!input) return;
      const received = parseFloat(input.value) || 0;
      const change = received - total;
      document.getElementById("changeVal").textContent = fmt(Math.max(change, 0));
      document.getElementById("changeRow").className = `flex justify-between text-lg font-bold ${change < 0 ? "text-rose-400" : "text-emerald-400"}`;
    }
    if (method === "Nakit") {
      updateChange();
      document.getElementById("mReceived").oninput = updateChange;
      document.querySelectorAll(".quickAmt").forEach(b => {
        b.onclick = () => { document.getElementById("mReceived").value = b.dataset.v; updateChange(); };
      });
    }
    if (method === "Veresiye") {
      const changeBtn = document.getElementById("mVeresiyeChange");
      if (changeBtn) changeBtn.onclick = () => { veresiyeCustomerId = null; build(); };
      const searchInput = document.getElementById("mVeresiyeSearch");
      if (searchInput) searchInput.oninput = (e) => { veresiyeSearch = e.target.value; build(); };
      document.querySelectorAll(".vCustBtn").forEach(b => {
        b.onclick = () => { veresiyeCustomerId = parseInt(b.dataset.id); build(); };
      });
      const newCustBtn = document.getElementById("mVeresiyeNewCust");
      if (newCustBtn) newCustBtn.onclick = () => {
        openCustomerModal(null, null, (saved) => { veresiyeCustomerId = saved.id; build(); });
      };
    }

    document.getElementById("mPayConfirm").onclick = () => {
      let received = total;
      if (method === "Nakit") {
        received = parseFloat(document.getElementById("mReceived").value) || 0;
        if (received < total) { alert("Alınan tutar toplam tutardan az olamaz."); return; }
      }
      if (method === "Veresiye") {
        if (!veresiyeCustomerId) { alert("Lütfen bir müşteri seçin."); return; }
        const cust = state.customers.find(c => c.id === veresiyeCustomerId);
        cust.balance = (cust.balance || 0) + total;
        state.ledger.push({ id: newId(), customerId: cust.id, date: Date.now(), type: "debt", amount: total, note: `Adisyon (${orderMeta().title})` });
        received = total;
      }
      finalizeOrder(method, received);
    };
  }
  build();
}

// ================= NAVİGASYON =================
function goDashboard() { orderView = null; keypadValue = ""; mainSection = "dashboard"; render(); }
function goSection(key) { orderView = null; keypadValue = ""; mainSection = key; render(); }
function dayGuardOk() {
  if (!state.dayOpen) { alert("Önce Gün İşlemleri'nden günü açmanız gerekiyor."); return false; }
  return true;
}
function openTable(id) { if (!dayGuardOk()) return; orderView = { type: "table", id }; keypadValue = ""; render(); }
function openPickup(id) { orderView = { type: "pickup", id }; keypadValue = ""; render(); }
function openDelivery(id) { orderView = { type: "delivery", id }; keypadValue = ""; render(); }

function openDay() {
  state.dayOpen = true;
  state.dayOpenedAt = Date.now();
  saveState();
  render();
}
function closeDay() {
  if (!confirm("Gün sonu yapılsın mı? Gün kapatıldıktan sonra yeni sipariş alınamaz.")) return;
  state.dayOpen = false;
  saveState();
  render();
}

function createPickup() {
  if (!dayGuardOk()) return;
  const name = prompt("Müşteri adı (opsiyonel):", "") || "Gel-Al Müşterisi";
  const order = { id: newId(), name, items: [], createdAt: Date.now() };
  state.pickupOrders.push(order);
  saveState();
  openPickup(order.id);
}

// ================= MÜŞTERİ MODALI =================
function openCustomerModal(customer, prefill, onSaved) {
  const isEdit = !!customer;
  const name = customer?.name || "";
  const phone = customer?.phone || prefill?.phone || "";
  const address = customer?.address || "";
  openModal(`
    <div class="bg-neutral-800 border border-neutral-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl text-white">
      <div class="font-bold text-lg mb-4">${isEdit ? "Müşteri Düzenle" : "Yeni Müşteri"}</div>
      <label class="block text-xs font-bold text-neutral-400 mb-1">Ad Soyad</label>
      <input id="mCustName" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-3" value="${escapeHtml(name)}" placeholder="Ad Soyad">
      <label class="block text-xs font-bold text-neutral-400 mb-1">Telefon</label>
      <input id="mCustPhone" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-3" value="${escapeHtml(phone)}" placeholder="05xx xxx xx xx">
      <label class="block text-xs font-bold text-neutral-400 mb-1">Adres</label>
      <textarea id="mCustAddress" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-4" rows="3" placeholder="Adres">${escapeHtml(address)}</textarea>
      <div class="grid grid-cols-2 gap-2">
        <button id="mCustCancel" class="bg-neutral-700 active:bg-neutral-600 text-white font-bold py-3 rounded-xl">İptal</button>
        <button id="mCustSave" class="bg-blue-600 active:bg-blue-700 text-white font-bold py-3 rounded-xl">Kaydet</button>
      </div>
    </div>
  `);
  document.getElementById("mCustCancel").onclick = closeModal;
  document.getElementById("mCustSave").onclick = () => {
    const n = document.getElementById("mCustName").value.trim();
    const p = document.getElementById("mCustPhone").value.trim();
    const a = document.getElementById("mCustAddress").value.trim();
    if (!n) { alert("Ad girin."); return; }
    let saved;
    if (isEdit) {
      customer.name = n; customer.phone = p; customer.address = a;
      saved = customer;
    } else {
      saved = { id: newId(), name: n, phone: p, address: a, balance: 0 };
      state.customers.push(saved);
    }
    saveState();
    closeModal();
    if (onSaved) onSaved(saved); else render();
  };
}
function addPosCustomer() {
  openCustomerModal(null, null, (saved) => { selectedPosCustomerId = saved.id; render(); });
}
function editPosCustomer() {
  const c = state.customers.find(x => x.id === selectedPosCustomerId);
  if (!c) { alert("Önce bir müşteri seçin."); return; }
  openCustomerModal(c, null, () => render());
}
function selectCustomerForDelivery() {
  if (!dayGuardOk()) return;
  const c = state.customers.find(x => x.id === selectedPosCustomerId);
  if (!c) { alert("Önce bir müşteri seçin."); return; }
  const order = { id: newId(), customerId: c.id, customerName: c.name, phone: c.phone, address: c.address, items: [], createdAt: Date.now() };
  state.deliveryOrders.push(order);
  saveState();
  openDelivery(order.id);
}

// ================= KATEGORİ / ÜRÜN YÖNETİMİ =================
function openCategoryModal(cat) {
  const isEdit = !!cat;
  openModal(`
    <div class="bg-neutral-800 border border-neutral-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl text-white">
      <div class="font-bold text-lg mb-4">${isEdit ? "Kategori Düzenle" : "Yeni Kategori"}</div>
      <label class="block text-xs font-bold text-neutral-400 mb-1">Kategori / Alt Kategori Adı</label>
      <input id="mCatName" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-4" value="${isEdit ? escapeHtml(cat.name) : ""}" placeholder="Örn: Döner - Tavuk">
      <div class="grid grid-cols-2 gap-2">
        <button id="mCatCancel" class="bg-neutral-700 active:bg-neutral-600 text-white font-bold py-3 rounded-xl">İptal</button>
        <button id="mCatSave" class="bg-orange-500 active:bg-orange-600 text-white font-bold py-3 rounded-xl">Kaydet</button>
      </div>
    </div>
  `);
  document.getElementById("mCatCancel").onclick = closeModal;
  document.getElementById("mCatSave").onclick = () => {
    const name = document.getElementById("mCatName").value.trim();
    if (!name) { alert("Kategori adı girin."); return; }
    if (isEdit) cat.name = name;
    else {
      const newCat = { id: newId(), name, products: [] };
      state.categories.push(newCat);
      selectedSettingsCategoryId = newCat.id;
    }
    saveState();
    closeModal();
    render();
  };
}
function deleteCategory(id) {
  if (!confirm("Bu kategori ve içindeki tüm ürünler silinsin mi?")) return;
  state.categories = state.categories.filter(c => c.id !== id);

      </div>
    </div>
  `);

  document.getElementById("mProdSave").onclick = () => {

    const price = parseFloat(document.getElementById("mProdPrice").value);
    if (!name || isNaN(price) || price < 0) { alert("Geçerli ürün adı ve fiyat girin."); return; }

function deleteProduct(categoryId, productId) {
  if (!confirm("Bu ürün silinsin mi?")) return;
  const cat = state.categories.find(c => c.id === categoryId);
  cat.products = cat.products.filter(p => p.id !== productId);
  saveState();
  render();
}

// ================= CARİ HESAP (VERESİYE) İŞLEMLERİ =================
function openLedgerModal(type) {
  const c = state.customers.find(x => x.id === selectedCariCustomerId);
  if (!c) return;
  const isDebt = type === "debt";
  openModal(`
    <div class="bg-neutral-800 border border-neutral-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl text-white">
      <div class="font-bold text-lg mb-1">${isDebt ? "Borç (Veresiye) Ekle" : "Tahsilat Yap"}</div>
      <div class="text-neutral-400 text-xs mb-4">${escapeHtml(c.name)} · Güncel Bakiye: ${fmt(c.balance || 0)}</div>
      <label class="block text-xs font-bold text-neutral-400 mb-1">Tutar (₺)</label>
      <input id="mLedgerAmount" type="number" step="0.01" inputmode="decimal" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-3" placeholder="0.00">
      <label class="block text-xs font-bold text-neutral-400 mb-1">Not (opsiyonel)</label>
      <input id="mLedgerNote" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-4" placeholder="Not">
      <div class="grid grid-cols-2 gap-2">
        <button id="mLedgerCancel" class="bg-neutral-700 active:bg-neutral-600 text-white font-bold py-3 rounded-xl">İptal</button>
        <button id="mLedgerSave" class="${isDebt ? "bg-rose-600 active:bg-rose-700" : "bg-emerald-600 active:bg-emerald-700"} text-white font-bold py-3 rounded-xl">${isDebt ? "Borç Ekle" : "Tahsil Et"}</button>
      </div>
    </div>
  `);
  document.getElementById("mLedgerCancel").onclick = closeModal;
  document.getElementById("mLedgerSave").onclick = () => {
    const amount = parseFloat(document.getElementById("mLedgerAmount").value);
    const note = document.getElementById("mLedgerNote").value.trim();
    if (!amount || amount <= 0) { alert("Geçerli bir tutar girin."); return; }
    c.balance = (c.balance || 0) + (isDebt ? amount : -amount);
    state.ledger.push({ id: newId(), customerId: c.id, date: Date.now(), type, amount, note });
    saveState();
    closeModal();
    render();
  };
}

// ================= RENDER: KÖK (HEADER / İÇERİK / FOOTER) =================
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(buildHeader());

  const main = document.createElement("div");
  main.className = "flex-1 min-h-0 overflow-hidden flex flex-col";
  let node;
  if (orderView) node = renderOrderScreen();
  else if (mainSection === "dashboard") node = renderDashboard();
  else if (mainSection === "gunislemleri") node = renderGunIslemleriSection();
  else if (mainSection === "pos") node = renderPosSection();
  else if (mainSection === "ayarlar") node = renderAyarlarSection();
  else if (mainSection === "adisyonlar") node = renderAdisyonlarSection();
  else if (mainSection === "depolar") node = renderDepolarSection();
  else if (mainSection === "eklentiler") node = renderEklentilerSection();
  else if (mainSection === "raporlar") node = renderRaporlarSection();
  else if (mainSection === "cari") node = renderCariSection();
  else if (mainSection === "kilit") node = renderKilitSection();
  main.appendChild(node);
  app.appendChild(main);

  app.appendChild(buildFooter());
}

function updateClock(el) {
  if (!el) return;
  const d = new Date();
  el.textContent = d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" }) + "  " + d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
}

function buildHeader() {
  const h = document.createElement("div");

// ================= RENDER: SİPARİŞ EKRANI (SambaPOS tarzı) =================
function buildKeypad() {
  const wrap = document.createElement("div");
  wrap.className = "p-2 bg-neutral-800 border-t border-neutral-700 shrink-0";
  const displayRow = document.createElement("div");
  displayRow.className = "flex gap-2 mb-2";
  const display = document.createElement("div");
  display.className = "flex-1 bg-neutral-900 border border-neutral-700 rounded px-3 py-2 text-white font-bold text-lg min-h-[2.5rem]";
  display.textContent = keypadValue || "Miktar";
  if (!keypadValue) display.classList.add("text-neutral-600");
  const clearBtn = document.createElement("button");
  clearBtn.className = "bg-neutral-700 active:bg-neutral-600 text-rose-400 font-bold px-4 rounded";
  clearBtn.textContent = "✕";
  clearBtn.onclick = () => { keypadValue = ""; render(); };
  displayRow.appendChild(display);
  displayRow.appendChild(clearBtn);
  wrap.appendChild(displayRow);

  const grid = document.createElement("div");
  grid.className = "grid grid-cols-3 gap-2";
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0", "⌫"].forEach(k => {
    const b = document.createElement("button");
    b.className = "bg-neutral-700 active:bg-neutral-600 text-white font-bold py-3 rounded text-lg";
    b.textContent = k;
    b.onclick = () => {
      if (k === "⌫") keypadValue = keypadValue.slice(0, -1);
      else if (k === ",") { if (!keypadValue.includes(",")) keypadValue += ","; }
      else keypadValue += k;
      render();
    };
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  return wrap;
}

  const header = document.createElement("div");
  header.className = "grid grid-cols-5 gap-2 px-4 py-3 bg-neutral-700 text-white font-bold text-sm";
  header.innerHTML = `<span>Adisyon No</span><span>Saat</span><span>Tutar</span><span>Tip</span><span>Ödeme</span>`;
  table.appendChild(header);
  if (!dayTickets.length) {
    const empty = document.createElement("div");
    empty.className = "p-6 text-center text-neutral-500 italic";
    empty.textContent = "Bu tarihte kapatılmış adisyon yok.";
    table.appendChild(empty);
  }
  dayTickets.forEach(t => {
    const row = document.createElement("div");
    row.className = "grid grid-cols-5 gap-2 px-4 py-3 border-b border-neutral-700 text-sm text-neutral-200";
    const time = new Date(t.closedAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    row.innerHTML = `<span class="font-bold text-white">#${t.ticketNo}</span><span>${time}</span><span class="font-bold text-white">${fmt(t.total)}</span><span>${escapeHtml(t.type)}</span><span>${escapeHtml(t.method)}</span>`;
    table.appendChild(row);
  });
  wrap.appendChild(table);
  return wrap;
}

// ================= RENDER: RAPORLAR =================
function renderRaporlarSection() {
  const wrap = document.createElement("div");
  wrap.className = "h-full overflow-y-auto p-4 bg-neutral-900";

  const t = todayStr();
  const todayTickets = state.closedTickets.filter(x => new Date(x.closedAt).toISOString().slice(0, 10) === t);
  const totalToday = todayTickets.reduce((s, x) => s + x.total, 0);
  const byMethod = {};
  todayTickets.forEach(x => { byMethod[x.method] = (byMethod[x.method] || 0) + x.total; });

  const grid = document.createElement("div");
  grid.className = "grid grid-cols-2 md:grid-cols-3 gap-4 mb-6";
  const cards = [
    ["Bugünkü Ciro", fmt(totalToday), "bg-emerald-700"],
    ["Bugünkü Adisyon Sayısı", String(todayTickets.length), "bg-blue-700"],
    ["Nakit", fmt(byMethod["Nakit"] || 0), "bg-teal-700"],
    ["Kredi Kartı", fmt(byMethod["Kredi Kartı"] || 0), "bg-indigo-700"],
    ["Veresiye", fmt(byMethod["Veresiye"] || 0), "bg-rose-700"],
    ["Toplam Cari Bakiye", fmt(state.customers.reduce((s, c) => s + (c.balance || 0), 0)), "bg-amber-700"]
  ];
  cards.forEach(([label, val, color]) => {
    const c = document.createElement("div");
    c.className = `${color} text-white rounded-2xl shadow p-5`;
    c.innerHTML = `<div class="text-sm opacity-80 mb-1">${label}</div><div class="text-2xl font-bold">${val}</div>`;
    grid.appendChild(c);
  });
  wrap.appendChild(grid);

  const note = document.createElement("div");
  note.className = "text-neutral-500 text-sm italic";
  note.textContent = "Detaylı raporlama (tarih aralığı, ürün bazlı satış vb.) sonraki aşamada eklenecek.";
  wrap.appendChild(note);

  return wrap;
}

// ================= RENDER: CARİ HESAPLAR (VERESİYE) =================
function renderCariSection() {
  const wrap = document.createElement("div");
  wrap.className = "h-full overflow-hidden flex flex-col md:flex-row gap-4 p-4 bg-neutral-900";

  const left = document.createElement("div");
  left.className = "flex-1 flex flex-col bg-neutral-800 border border-neutral-700 rounded-xl overflow-hidden";
  const search = document.createElement("input");
  search.placeholder = "Müşteri ara...";
  search.value = customerSearchCari;
  search.className = "p-3 bg-neutral-900 border-b border-neutral-700 text-white outline-none";
  search.oninput = (e) => { customerSearchCari = e.target.value; render(); };
  left.appendChild(search);

  const listWrap = document.createElement("div");
  listWrap.className = "flex-1 overflow-y-auto";
  const header = document.createElement("div");
  header.className = "grid grid-cols-3 gap-2 px-3 py-2 bg-neutral-700 font-bold text-neutral-200 text-xs sticky top-0";
  header.innerHTML = `<span>Adı</span><span>Telefon</span><span>Bakiye</span>`;
  listWrap.appendChild(header);

  const q = customerSearchCari.trim().toLowerCase();
  const filtered = state.customers.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").includes(q));
  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "text-neutral-500 italic p-4";
    empty.textContent = "Müşteri bulunamadı.";
    listWrap.appendChild(empty);
  }
  filtered.forEach(c => {
    const row = document.createElement("div");
    const active = selectedCariCustomerId === c.id;
    const bal = c.balance || 0;
    row.className = `grid grid-cols-3 gap-2 px-3 py-2 border-b border-neutral-700 cursor-pointer ${active ? "bg-blue-950/60" : "active:bg-neutral-700"}`;
    row.innerHTML = `<span class="truncate font-semibold text-white">${escapeHtml(c.name)}</span><span class="truncate text-neutral-300">${escapeHtml(c.phone || "")}</span><span class="font-bold ${bal > 0 ? "text-rose-400" : "text-emerald-400"}">${fmt(bal)}</span>`;
    row.onclick = () => { selectedCariCustomerId = c.id; render(); };
    listWrap.appendChild(row);
  });
  left.appendChild(listWrap);
  wrap.appendChild(left);

  const right = document.createElement("div");
  right.className = "w-full md:w-80 flex flex-col gap-2";
  const mkBtn = (label, cls, fn, disabled) => {
    const b = document.createElement("button");
    b.className = `py-4 rounded-xl font-bold text-white ${disabled ? "bg-neutral-700 text-neutral-500" : cls}`;
    b.textContent = label;
    b.disabled = !!disabled;
    b.onclick = fn;
    return b;
  };
  right.appendChild(mkBtn("+ Yeni Müşteri", "bg-blue-600 active:bg-blue-700", () => openCustomerModal(null, null, (saved) => { selectedCariCustomerId = saved.id; render(); }), false));
  right.appendChild(mkBtn("Borç (Veresiye) Ekle", "bg-rose-600 active:bg-rose-700", () => openLedgerModal("debt"), !selectedCariCustomerId));
  right.appendChild(mkBtn("Tahsilat Yap", "bg-emerald-600 active:bg-emerald-700", () => openLedgerModal("payment"), !selectedCariCustomerId));

  const histTitle = document.createElement("div");
  histTitle.className = "font-bold text-neutral-200 mt-3";
  histTitle.textContent = "Hareket Geçmişi";
  right.appendChild(histTitle);

  const histList = document.createElement("div");
  histList.className = "flex-1 overflow-y-auto flex flex-col gap-2";
  if (selectedCariCustomerId) {
    const txs = state.ledger.filter(l => l.customerId === selectedCariCustomerId).sort((a, b) => b.date - a.date);
    if (!txs.length) {
      const e = document.createElement("div");
      e.className = "text-neutral-500 italic text-xs";
      e.textContent = "Hareket yok.";
      histList.appendChild(e);
    }
    txs.forEach(tx => {
      const row = document.createElement("div");
      const isDebt = tx.type === "debt";
      row.className = `rounded-lg p-2 text-xs flex justify-between ${isDebt ? "bg-rose-950/60 text-rose-300" : "bg-emerald-950/60 text-emerald-300"}`;
      row.innerHTML = `<span>${new Date(tx.date).toLocaleString("tr-TR")}${tx.note ? " · " + escapeHtml(tx.note) : ""}</span><span class="font-bold">${isDebt ? "+" : "-"}${fmt(tx.amount)}</span>`;
      histList.appendChild(row);
    });
  } else {
    const e = document.createElement("div");
    e.className = "text-neutral-500 italic text-xs";
    e.textContent = "Önce bir müşteri seçin.";
    histList.appendChild(e);
  }
  right.appendChild(histList);

  wrap.appendChild(right);
  return wrap;
}

const appLoadedAt = new Date();

function normalizePhone(p) { return (p || "").replace(/\D/g, "").slice(-10); }
function findCustomerByPhone(phone) {
  const norm = normalizePhone(phone);
  return state.customers.find(c => normalizePhone(c.phone) === norm) || null;
}

function showCallerBanner(phone) {
  const customer = findCustomerByPhone(phone);
  const wrap = document.getElementById("callerBannerWrap");
  const banner = document.createElement("div");
  banner.id = "callerBanner";
  banner.className = "fixed bottom-16 right-4 z-50 bg-neutral-800 border-l-4 border-orange-500 rounded-lg shadow-2xl w-72 cursor-pointer overflow-hidden";
  banner.innerHTML = `
    <div class="flex justify-between items-start p-3">
      <div class="min-w-0">
        <div class="font-bold text-white text-base truncate">${customer ? escapeHtml(customer.name) : "Bilinmeyen Numara"}</div>
        <div class="text-xs text-neutral-300 mt-1">📞 Telefon: ${escapeHtml(phone)}</div>
        <div class="text-xs text-neutral-400 truncate">📍 Adres: ${customer && customer.address ? escapeHtml(customer.address) : "-"}</div>
        <div class="text-sm font-bold mt-1 ${customer && (customer.balance || 0) > 0 ? "text-rose-400" : "text-emerald-400"}">Bakiye: ${fmt(customer ? (customer.balance || 0) : 0)}</div>
      </div>
      <button id="callDismissBtn" class="text-neutral-400 active:text-white text-lg leading-none px-1">✕</button>
    </div>
  `;
  wrap.innerHTML = "";
  wrap.appendChild(banner);

  document.getElementById("callDismissBtn").onclick = (e) => { e.stopPropagation(); wrap.innerHTML = ""; };
  banner.onclick = () => {
    wrap.innerHTML = "";
    mainSection = "pos";
    posTab = "paket";
    if (customer) {
      selectedPosCustomerId = customer.id;
      selectCustomerForDelivery();
    } else {
      openCustomerModal(null, { phone }, (saved) => {
        selectedPosCustomerId = saved.id;
        selectCustomerForDelivery();
      });
    }
  };

  setTimeout(() => { if (wrap.firstChild === banner) wrap.innerHTML = ""; }, 45000);
}

function initCallerId() {
  if (firebaseConfig.apiKey === "BURAYA_API_KEY") {
    console.warn("Caller ID: firebaseConfig doldurulmadı, dinleme başlatılmadı.");
    return;
  }
  if (typeof firebase === "undefined") {
    console.error("Caller ID: Firebase SDK yüklenemedi (internet bağlantısı veya CDN engeli olabilir).");
    return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const callsCollection = currentTenantId
      ? db.collection("tenants").doc(currentTenantId).collection("incomingCalls")
      : db.collection("incomingCalls");
    callsCollection.orderBy("timestamp", "desc").limit(1)
      .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
          if (change.type !== "added") return;
          const data = change.doc.data();
          const ts = data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
          if (ts < appLoadedAt) return;
          showCallerBanner(data.phone);
        });
      }, err => console.error("Caller ID dinleme hatası:", err));
  } catch (e) { console.error("Firebase başlatılamadı:", e); }
}

// ================= GİRİŞ EKRANI (Firebase Auth) =================
function renderLoginScreen(errorMsg) {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "h-screen flex items-center justify-center bg-neutral-900";
  wrap.innerHTML = `
    <div class="bg-neutral-800 border border-neutral-700 rounded-2xl shadow-2xl p-8 w-full max-w-sm text-white">
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">🍊</div>
        <div class="font-bold text-xl">RestoPOS Girişi</div>
        <div class="text-neutral-500 text-xs mt-1">Devam etmek için giriş yapın</div>
      </div>
      ${errorMsg ? `<div class="bg-rose-950 text-rose-300 text-sm rounded-lg p-2 mb-3">${escapeHtml(errorMsg)}</div>` : ""}
      <label class="block text-xs font-bold text-neutral-400 mb-1">E-posta</label>
      <input id="loginEmail" type="email" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-3" placeholder="ornek@eposta.com">
      <label class="block text-xs font-bold text-neutral-400 mb-1">Şifre</label>
      <input id="loginPassword" type="password" class="w-full bg-neutral-900 border border-neutral-700 text-white rounded-lg p-3 mb-4" placeholder="••••••••">
      <button id="loginBtn" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 rounded-xl">Giriş Yap</button>
    </div>
  `;
  app.appendChild(wrap);
  const doLogin = () => {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if (!email || !password) { renderLoginScreen("E-posta ve şifre girin."); return; }
    firebase.auth().signInWithEmailAndPassword(email, password)
      .catch(err => renderLoginScreen("Giriş başarısız: " + (err.message || "bilinmeyen hata")));
  };
  document.getElementById("loginBtn").onclick = doLogin;
  document.getElementById("loginPassword").onkeydown = (e) => { if (e.key === "Enter") doLogin(); };
}

function startAppAfterLogin(user) {
  mainSection = "dashboard";
  firebase.firestore().collection("userTenantMap").doc(user.uid).get().then(mapSnap => {
    if (!mapSnap.exists || !mapSnap.data().tenantId) {
      alert("Bu hesap henüz bir işletmeye bağlanmamış. Lütfen yönetici ile iletişime geçin.");
      firebase.auth().signOut();
      return;
    }
    currentTenantId = mapSnap.data().tenantId;
    firestoreDocRef = firebase.firestore().collection("tenants").doc(currentTenantId).collection("posState").doc("main");
    firestoreDocRef.get().then(snap => {
      if (snap.exists && snap.data() && snap.data().json) {
        try { state = JSON.parse(snap.data().json); } catch (e) {}
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } else {
        firestoreDocRef.set({ json: JSON.stringify(state), updatedAt: Date.now() }).catch(() => {});
      }
      render();
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      unsubscribeSnapshot = firestoreDocRef.onSnapshot(snap => {
        if (!snap.exists) return;
        const data = snap.data();
        if (!data || !data.json) return;
        try {
          state = JSON.parse(data.json);
          localStorage.setItem(STORAGE_KEY, data.json);
          if (!orderView) render();
        } catch (e) {}
      }, err => console.error("Firestore dinleme hatası:", err));
      initCallerId();
    }).catch(err => {
      console.error("Firestore okunamadı:", err);
      render();
      initCallerId();
    });
  }).catch(err => {
    console.error("Tenant bilgisi okunamadı:", err);
    alert("İşletme bilgisi okunamadı, tekrar giriş yapmayı deneyin.");
    firebase.auth().signOut();
  });
}

// ================= BAŞLAT =================
setInterval(() => {
  const clockBox = document.getElementById("clockBox");
  if (clockBox) updateClock(clockBox);
  if (!orderView && (mainSection === "pos" || mainSection === "raporlar" || mainSection === "adisyonlar")) render();
}, 30000);

if (typeof firebase === "undefined" || firebaseConfig.apiKey === "BURAYA_API_KEY") {
  // Firebase yapılandırılmamışsa eski localStorage moduyla çalışmaya devam et
  render();
  initCallerId();
} else {
  firebase.initializeApp(firebaseConfig);
  firebase.auth().onAuthStateChanged(user => {
    if (user) startAppAfterLogin(user);
    else renderLoginScreen();
  });
}
